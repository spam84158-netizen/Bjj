# Compile l'APK Android et le build iOS à chaque lancement manuel (Actions > Mobile > Run workflow).
# Prérequis : l'URL de l'app (mobile/capacitor.config.json) doit déjà être en ligne.
name: Mobile
on: workflow_dispatch
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: |
          cd mobile && npm init -y >/dev/null
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android && npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: devbox-android-apk, path: mobile/android/app/build/outputs/apk/debug/*.apk}
  ios:
    runs-on: macos-latest   # un .ipa installable exige un compte Apple Developer + certificats (secrets)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: |
          cd mobile && npm init -y >/dev/null
          npm i @capacitor/core @capacitor/cli @capacitor/ios
          npx cap add ios && npx cap sync ios
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug build CODE_SIGNING_ALLOWED=NO
